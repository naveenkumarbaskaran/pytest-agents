[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-agents"
version = "0.1.0"
description = "Pytest plugin for testing AI agents — mock LLMs, assert tool calls, track tokens, regression-test prompts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Naveen Kumar Baskaran", email = "naveenkumarbaskaran@outlook.com" },
]
keywords = [
    "pytest", "testing", "ai", "agents", "llm", "langchain",
    "openai", "anthropic", "tool-calling", "a2a", "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pytest>=7.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
litellm = ["litellm>=1.0"]
all = ["openai>=1.0", "litellm>=1.0"]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5.0",
]

[project.entry-points.pytest11]
agents = "pytest_agents.plugin"

[project.urls]
Homepage = "https://github.com/naveenkumarbaskaran/pytest-agents"
Repository = "https://github.com/naveenkumarbaskaran/pytest-agents"
Issues = "https://github.com/naveenkumarbaskaran/pytest-agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_agents"]

[tool.hatch.build.targets.sdist]
include = ["src/pytest_agents", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
